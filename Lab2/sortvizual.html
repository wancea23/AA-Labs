<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sort Visualizer</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0d0d;
            --surface: #141414;
            --border: #222;
            --accent: #e8ff5a;
            --accent2: #ff5a7a;
            --accent3: #5adfff;
            --text: #f0f0f0;
            --muted: #555;
            --compare: #ff5a7a;
            --swap: #e8ff5a;
            --sorted: #5adfff;
            --normal: #2a2a2a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'IBM Plex Mono', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 32px 16px;
            gap: 20px;
        }

        header {
            text-align: center;
        }

        header h1 {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            color: var(--accent);
            text-transform: uppercase;
        }

        header p {
            font-size: 0.65rem;
            color: var(--muted);
            margin-top: 4px;
            letter-spacing: 0.1em;
        }

        .setup {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-end;
            width: 100%;
            max-width: 860px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field label {
            font-size: 0.6rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        select,
        input[type=text] {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.8rem;
            padding: 8px 12px;
            border-radius: 6px;
            outline: none;
            transition: border-color 0.15s;
        }

        select:focus,
        input[type=text]:focus {
            border-color: var(--accent);
        }

        input[type=text] {
            width: 340px;
        }

        .btn {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 9px 20px;
            border-radius: 6px;
            cursor: pointer;
            letter-spacing: 0.08em;
            transition: background 0.15s, color 0.15s;
            text-transform: uppercase;
        }

        .btn:hover {
            background: var(--accent);
            color: var(--bg);
        }

        .btn.red {
            border-color: var(--accent2);
            color: var(--accent2);
        }

        .btn.red:hover {
            background: var(--accent2);
            color: var(--bg);
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* speed */
        .speed-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100px;
            height: 3px;
            background: var(--border);
            border-radius: 3px;
            outline: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
        }

        /* main viz area */
        .viz {
            width: 100%;
            max-width: 860px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
        }

        .bars-wrap {
            display: flex;
            align-items: flex-end;
            gap: 3px;
            height: 220px;
            margin-bottom: 14px;
        }

        .bar {
            flex: 1;
            border-radius: 3px 3px 0 0;
            transition: height 0.08s, background 0.08s;
            position: relative;
            min-width: 4px;
        }

        .bar.normal {
            background: var(--normal);
            border: 1px solid #333;
        }

        .bar.compare {
            background: var(--compare);
            box-shadow: 0 0 8px var(--compare);
        }

        .bar.swap {
            background: var(--swap);
            box-shadow: 0 0 8px var(--swap);
        }

        .bar.sorted {
            background: var(--sorted);
        }

        .bar-label {
            font-size: 9px;
            color: var(--muted);
            text-align: center;
            margin-top: 4px;
            overflow: hidden;
            white-space: nowrap;
        }

        /* stats row */
        .stats {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
        }

        .stat {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .stat-label {
            font-size: 0.58rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .stat-val {
            font-size: 1rem;
            font-weight: 700;
        }

        /* controls row */
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid var(--border);
        }

        /* step log */
        .log {
            width: 100%;
            max-width: 860px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 18px;
            max-height: 140px;
            overflow-y: auto;
        }

        .log-line {
            font-size: 0.68rem;
            color: var(--muted);
            line-height: 1.8;
        }

        .log-line.active {
            color: var(--text);
        }

        .log-line .c {
            color: var(--compare);
        }

        .log-line .s {
            color: var(--swap);
        }

        .log-line .ok {
            color: var(--sorted);
        }

        .legend {
            display: flex;
            gap: 16px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .leg {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.62rem;
            color: var(--muted);
        }

        .leg-box {
            width: 10px;
            height: 10px;
            border-radius: 2px;
        }

        .err {
            font-size: 0.7rem;
            color: var(--accent2);
            margin-top: 4px;
            min-height: 16px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Sort Visualizer</h1>
        <p>// choose algorithm · enter array · watch it run</p>
    </header>

    <div class="setup">
        <div class="field">
            <label>Algorithm</label>
            <select id="algoSelect">
                <option value="bubble">Bubble Sort</option>
                <option value="quick">Quick Sort</option>
                <option value="merge">Merge Sort</option>
                <option value="heap">Heap Sort</option>
            </select>
        </div>
        <div class="field">
            <label>Array (comma separated)</label>
            <input type="text" id="arrayInput" value="38, 27, 43, 3, 9, 82, 10, 55, 17, 61"
                placeholder="e.g. 5, 3, 8, 1, 9">
            <div class="err" id="errMsg"></div>
        </div>
        <div class="field">
            <label>Speed</label>
            <div class="speed-row">
                <span style="font-size:0.65rem;color:var(--muted)">slow</span>
                <input type="range" id="speedSlider" min="1" max="10" value="5">
                <span style="font-size:0.65rem;color:var(--muted)">fast</span>
            </div>
        </div>
        <button class="btn" id="runBtn">▶ Run</button>
    </div>

    <div class="viz">
        <div class="bars-wrap" id="barsWrap"></div>
        <div class="bar-label" id="barLabels" style="display:flex;gap:3px;"></div>
        <div class="legend">
            <div class="leg">
                <div class="leg-box" style="background:var(--normal);border:1px solid #444"></div>unsorted
            </div>
            <div class="leg">
                <div class="leg-box" style="background:var(--compare)"></div>comparing
            </div>
            <div class="leg">
                <div class="leg-box" style="background:var(--swap)"></div>swapping
            </div>
            <div class="leg">
                <div class="leg-box" style="background:var(--sorted)"></div>sorted
            </div>
        </div>
        <div class="controls">
            <div class="stats">
                <div class="stat">
                    <div class="stat-label">Step</div>
                    <div class="stat-val" id="statStep" style="color:var(--text)">—</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Comparisons</div>
                    <div class="stat-val" id="statComp" style="color:var(--accent3)">0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Swaps</div>
                    <div class="stat-val" id="statSwap" style="color:var(--accent)">0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Status</div>
                    <div class="stat-val" id="statStatus" style="color:var(--muted);font-size:0.75rem">idle</div>
                </div>
            </div>
            <div style="flex:1"></div>
            <button class="btn red" id="stopBtn" disabled>■ Stop</button>
        </div>
    </div>

    <div class="log" id="logBox">
        <div class="log-line" style="color:var(--muted)">// run a sort to see step-by-step log</div>
    </div>

    <script>
        // ── SORT ALGORITHMS → produce step arrays ─────────────────────────────────────
        // Each step: { arr, highlight: [{idx, type}], log, comparisons, swaps }

        function bubbleSteps(input) {
            const arr = [...input];
            const steps = [];
            const n = arr.length;
            let comp = 0, swap = 0;
            const sortedSet = new Set();

            for (let i = 0; i < n; i++) {
                let swapped = false;
                for (let j = 0; j < n - i - 1; j++) {
                    comp++;
                    steps.push({
                        arr: [...arr], highlight: [{ idx: j, type: 'compare' }, { idx: j + 1, type: 'compare' }],
                        log: `<span class="c">compare</span> arr[${j}]=${arr[j]} vs arr[${j + 1}]=${arr[j + 1]}`,
                        comparisons: comp, swaps: swap, sorted: [...sortedSet]
                    });
                    if (arr[j] > arr[j + 1]) {
                        [arr[j], arr[j + 1]] = [arr[j + 1], arr[j]];
                        swap++;
                        swapped = true;
                        steps.push({
                            arr: [...arr], highlight: [{ idx: j, type: 'swap' }, { idx: j + 1, type: 'swap' }],
                            log: `<span class="s">swap</span>    arr[${j}] ↔ arr[${j + 1}] → [${arr[j]}, ${arr[j + 1]}]`,
                            comparisons: comp, swaps: swap, sorted: [...sortedSet]
                        });
                    }
                }
                sortedSet.add(n - 1 - i);
                if (!swapped) {
                    for (let k = 0; k < n - i - 1; k++) sortedSet.add(k);
                    break;
                }
            }
            steps.push({
                arr: [...arr], highlight: [], log: `<span class="ok">done</span>    sorted: [${arr}]`,
                comparisons: comp, swaps: swap, sorted: Array.from({ length: n }, (_, i) => i)
            });
            return steps;
        }

        function quickSteps(input) {
            const arr = [...input];
            const steps = [];
            let comp = 0, swap = 0;
            const sortedSet = new Set();

            function partition(lo, hi) {
                const pivot = arr[hi];
                let i = lo - 1;
                steps.push({
                    arr: [...arr], highlight: [{ idx: hi, type: 'compare' }],
                    log: `<span class="c">pivot</span>   arr[${hi}]=${pivot}`,
                    comparisons: comp, swaps: swap, sorted: [...sortedSet]
                });
                for (let j = lo; j < hi; j++) {
                    comp++;
                    steps.push({
                        arr: [...arr], highlight: [{ idx: j, type: 'compare' }, { idx: hi, type: 'compare' }],
                        log: `<span class="c">compare</span> arr[${j}]=${arr[j]} vs pivot=${pivot}`,
                        comparisons: comp, swaps: swap, sorted: [...sortedSet]
                    });
                    if (arr[j] <= pivot) {
                        i++;
                        [arr[i], arr[j]] = [arr[j], arr[i]]; swap++;
                        steps.push({
                            arr: [...arr], highlight: [{ idx: i, type: 'swap' }, { idx: j, type: 'swap' }],
                            log: `<span class="s">swap</span>    arr[${i}]=${arr[i]} ↔ arr[${j}]=${arr[j]}`,
                            comparisons: comp, swaps: swap, sorted: [...sortedSet]
                        });
                    }
                }
                [arr[i + 1], arr[hi]] = [arr[hi], arr[i + 1]]; swap++;
                sortedSet.add(i + 1);
                steps.push({
                    arr: [...arr], highlight: [{ idx: i + 1, type: 'swap' }],
                    log: `<span class="s">place</span>   pivot ${pivot} at index ${i + 1}`,
                    comparisons: comp, swaps: swap, sorted: [...sortedSet]
                });
                return i + 1;
            }

            function qs(lo, hi) {
                if (lo < hi) {
                    const p = partition(lo, hi);
                    qs(lo, p - 1);
                    qs(p + 1, hi);
                } else if (lo === hi) sortedSet.add(lo);
            }

            qs(0, arr.length - 1);
            steps.push({
                arr: [...arr], highlight: [], log: `<span class="ok">done</span>    sorted: [${arr}]`,
                comparisons: comp, swaps: swap, sorted: Array.from({ length: arr.length }, (_, i) => i)
            });
            return steps;
        }

        function mergeSteps(input) {
            const arr = [...input];
            const steps = [];
            let comp = 0, swap = 0;
            const sortedSet = new Set();

            function merge(lo, mid, hi) {
                const left = arr.slice(lo, mid + 1);
                const right = arr.slice(mid + 1, hi + 1);
                let i = 0, j = 0, k = lo;
                while (i < left.length && j < right.length) {
                    comp++;
                    steps.push({
                        arr: [...arr], highlight: [{ idx: lo + i, type: 'compare' }, { idx: mid + 1 + j, type: 'compare' }],
                        log: `<span class="c">compare</span> L[${i}]=${left[i]} vs R[${j}]=${right[j]}`,
                        comparisons: comp, swaps: swap, sorted: [...sortedSet]
                    });
                    if (left[i] <= right[j]) { arr[k++] = left[i++]; }
                    else { arr[k++] = right[j++]; swap++; }
                    steps.push({
                        arr: [...arr], highlight: [{ idx: k - 1, type: 'swap' }],
                        log: `<span class="s">place</span>   arr[${k - 1}]=${arr[k - 1]}`,
                        comparisons: comp, swaps: swap, sorted: [...sortedSet]
                    });
                }
                while (i < left.length) arr[k++] = left[i++];
                while (j < right.length) arr[k++] = right[j++];
                for (let x = lo; x <= hi; x++) sortedSet.add(x);
            }

            function ms(lo, hi) {
                if (lo >= hi) { sortedSet.add(lo); return; }
                const mid = Math.floor((lo + hi) / 2);
                ms(lo, mid); ms(mid + 1, hi);
                merge(lo, mid, hi);
            }

            ms(0, arr.length - 1);
            steps.push({
                arr: [...arr], highlight: [], log: `<span class="ok">done</span>    sorted: [${arr}]`,
                comparisons: comp, swaps: swap, sorted: Array.from({ length: arr.length }, (_, i) => i)
            });
            return steps;
        }

        function heapSteps(input) {
            const arr = [...input];
            const steps = [];
            const n = arr.length;
            let comp = 0, swap = 0;
            const sortedSet = new Set();

            function heapify(size, i) {
                let largest = i, l = 2 * i + 1, r = 2 * i + 2;
                if (l < size) {
                    comp++;
                    steps.push({
                        arr: [...arr], highlight: [{ idx: i, type: 'compare' }, { idx: l, type: 'compare' }],
                        log: `<span class="c">compare</span> arr[${i}]=${arr[i]} vs arr[${l}]=${arr[l]}`,
                        comparisons: comp, swaps: swap, sorted: [...sortedSet]
                    });
                    if (arr[l] > arr[largest]) largest = l;
                }
                if (r < size) {
                    comp++;
                    steps.push({
                        arr: [...arr], highlight: [{ idx: largest, type: 'compare' }, { idx: r, type: 'compare' }],
                        log: `<span class="c">compare</span> arr[${largest}]=${arr[largest]} vs arr[${r}]=${arr[r]}`,
                        comparisons: comp, swaps: swap, sorted: [...sortedSet]
                    });
                    if (arr[r] > arr[largest]) largest = r;
                }
                if (largest !== i) {
                    [arr[i], arr[largest]] = [arr[largest], arr[i]]; swap++;
                    steps.push({
                        arr: [...arr], highlight: [{ idx: i, type: 'swap' }, { idx: largest, type: 'swap' }],
                        log: `<span class="s">swap</span>    arr[${i}]=${arr[i]} ↔ arr[${largest}]=${arr[largest]}`,
                        comparisons: comp, swaps: swap, sorted: [...sortedSet]
                    });
                    heapify(size, largest);
                }
            }

            for (let i = Math.floor(n / 2) - 1; i >= 0; i--) heapify(n, i);

            for (let i = n - 1; i > 0; i--) {
                [arr[0], arr[i]] = [arr[i], arr[0]]; swap++;
                sortedSet.add(i);
                steps.push({
                    arr: [...arr], highlight: [{ idx: 0, type: 'swap' }, { idx: i, type: 'swap' }],
                    log: `<span class="s">extract</span> max ${arr[i]} → position ${i}`,
                    comparisons: comp, swaps: swap, sorted: [...sortedSet]
                });
                heapify(i, 0);
            }
            sortedSet.add(0);
            steps.push({
                arr: [...arr], highlight: [], log: `<span class="ok">done</span>    sorted: [${arr}]`,
                comparisons: comp, swaps: swap, sorted: Array.from({ length: n }, (_, i) => i)
            });
            return steps;
        }

        // ── UI ────────────────────────────────────────────────────────────────────────
        let running = false, timer = null;

        function getDelay() {
            const v = parseInt(document.getElementById('speedSlider').value);
            return Math.round(800 / v);
        }

        function parseArray() {
            const raw = document.getElementById('arrayInput').value;
            const parts = raw.split(',').map(s => s.trim()).filter(Boolean);
            const nums = parts.map(Number);
            if (nums.some(isNaN)) throw new Error('Invalid numbers in array');
            if (nums.length < 2) throw new Error('Need at least 2 numbers');
            if (nums.length > 60) throw new Error('Max 60 elements');
            return nums;
        }

        function renderBars(arr, highlight, sortedIndices) {
            const wrap = document.getElementById('barsWrap');
            const labels = document.getElementById('barLabels');
            const maxVal = Math.max(...arr, 1);
            const highlighted = new Map(highlight.map(h => [h.idx, h.type]));
            const sortedSet = new Set(sortedIndices);

            wrap.innerHTML = '';
            labels.innerHTML = '';

            arr.forEach((v, i) => {
                const bar = document.createElement('div');
                bar.className = 'bar';
                bar.style.height = `${Math.max(4, (v / maxVal) * 200)}px`;

                const type = highlighted.get(i);
                if (type === 'compare') bar.classList.add('compare');
                else if (type === 'swap') bar.classList.add('swap');
                else if (sortedSet.has(i)) bar.classList.add('sorted');
                else bar.classList.add('normal');

                wrap.appendChild(bar);

                const lbl = document.createElement('div');
                lbl.style.flex = '1';
                lbl.style.textAlign = 'center';
                lbl.style.fontSize = arr.length > 30 ? '7px' : '9px';
                lbl.style.color = '#555';
                lbl.style.minWidth = '4px';
                lbl.textContent = arr.length <= 40 ? v : '';
                labels.appendChild(lbl);
            });
        }

        function log(line, isActive) {
            const box = document.getElementById('logBox');
            const div = document.createElement('div');
            div.className = 'log-line' + (isActive ? ' active' : '');
            div.innerHTML = line;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function clearLog() {
            document.getElementById('logBox').innerHTML = '';
        }

        function setStatus(text, color) {
            const el = document.getElementById('statStatus');
            el.textContent = text;
            el.style.color = color || 'var(--muted)';
        }

        function runSort() {
            const errEl = document.getElementById('errMsg');
            errEl.textContent = '';
            let arr;
            try { arr = parseArray(); } catch (e) { errEl.textContent = e.message; return; }

            const algo = document.getElementById('algoSelect').value;
            let steps;
            try {
                if (algo === 'bubble') steps = bubbleSteps(arr);
                else if (algo === 'quick') steps = quickSteps(arr);
                else if (algo === 'merge') steps = mergeSteps(arr);
                else steps = heapSteps(arr);
            } catch (e) { errEl.textContent = e.message; return; }

            clearLog();
            running = true;
            document.getElementById('runBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            setStatus('running', 'var(--accent)');

            let i = 0;
            function tick() {
                if (!running || i >= steps.length) {
                    running = false;
                    document.getElementById('runBtn').disabled = false;
                    document.getElementById('stopBtn').disabled = true;
                    setStatus(i >= steps.length ? 'done ✓' : 'stopped', i >= steps.length ? 'var(--sorted)' : 'var(--muted)');
                    return;
                }
                const step = steps[i];
                renderBars(step.arr, step.highlight || [], step.sorted || []);
                document.getElementById('statStep').textContent = i + 1;
                document.getElementById('statComp').textContent = step.comparisons;
                document.getElementById('statSwap').textContent = step.swaps;
                log(step.log, true);
                i++;
                timer = setTimeout(tick, getDelay());
            }
            tick();
        }

        document.getElementById('runBtn').addEventListener('click', () => {
            if (running) { running = false; clearTimeout(timer); }
            runSort();
        });

        document.getElementById('stopBtn').addEventListener('click', () => {
            running = false;
            clearTimeout(timer);
            document.getElementById('runBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            setStatus('stopped');
        });

        // init display
        (function () {
            try {
                const arr = parseArray();
                renderBars(arr, [], []);
            } catch (e) { }
        })();
    </script>
</body>

</html>
